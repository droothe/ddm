<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download with DDM</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 18px;
        color: #e5e7eb;
        background: #0a0f1d;
        font: 14px/1.5 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      p {
        margin: 0;
        color: #aab4c5;
      }
      #status {
        margin-bottom: 10px;
        color: #67e8f9;
      }
    </style>
  </head>
  <body>
    <h1>Download with DDM</h1>
    <p id="status" role="status">Checking for an open DDM tab…</p>
    <p>Right-click a link and choose <strong>Download with DDM</strong>. If no DDM web tab is open, the extension tries the desktop app.</p>
    <script src="popup.js"></script>
  </body>
</html>
