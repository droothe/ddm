name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "bun.lock"
      - "package.json"
      - "src/**"
      - "src-tauri/**"
      - "vite.tauri.config.ts"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test Android project preparation
        run: python src-tauri/android/test_prepare_android.py

      - name: Initialize Android project
        working-directory: src-tauri
        run: cargo tauri android init --ci --skip-targets-install

      - name: Apply Android manifest and native plugin
        run: python src-tauri/android/prepare_android.py

      - name: Build arm64 APK
        working-directory: src-tauri
        run: cargo tauri android build --ci --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ddm-android-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
